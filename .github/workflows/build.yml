name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          python -m PyInstaller `
            --name "PDF_Stamper" `
            --windowed `
            --onefile `
            --clean `
            --noconfirm `
            app.py

      - name: Package EXE + stamps folder
        run: |
          mkdir release
          copy dist\PDF_Stamper.exe release\
          xcopy stamps release\stamps\ /E /I
          Compress-Archive -Path release\* -DestinationPath PDF_Stamper.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF_Stamper_Windows
          path: PDF_Stamper.zip
          retention-days: 30
